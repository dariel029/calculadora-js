<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Web con Historial</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="main-container">
        <!-- Calculadora -->
        <div class="calculator">
            <input type="text" id="display" class="display" readonly value="0">
            
            <div class="buttons">
                <button onclick="limpiar()" class="btn btn-clear">C</button>
                <button onclick="borrarUno()" class="btn btn-action">⌫</button>
                <button onclick="agregarOperacion('/')" class="btn btn-operator">÷</button>
                <button onclick="agregarOperacion('*')" class="btn btn-operator">×</button>

                <button onclick="agregarNumero('7')" class="btn">7</button>
                <button onclick="agregarNumero('8')" class="btn">8</button>
                <button onclick="agregarNumero('9')" class="btn">9</button>
                <button onclick="agregarOperacion('-')" class="btn btn-operator">-</button>

                <button onclick="agregarNumero('4')" class="btn">4</button>
                <button onclick="agregarNumero('5')" class="btn">5</button>
                <button onclick="agregarNumero('6')" class="btn">6</button>
                <button onclick="agregarOperacion('+')" class="btn btn-operator">+</button>

                <button onclick="agregarNumero('1')" class="btn">1</button>
                <button onclick="agregarNumero('2')" class="btn">2</button>
                <button onclick="agregarNumero('3')" class="btn">3</button>
                <button onclick="calcular()" class="btn btn-equal" style="grid-row: span 2;">=</button>

                <button onclick="agregarNumero('0')" class="btn btn-zero">0</button>
                <button onclick="agregarNumero('.')" class="btn">.</button>
            </div>
        </div>

        <!-- Historial -->
        <div class="history-card">
            <h2>Historial de Operaciones</h2>
            <ul id="history-list"></ul>
            <button onclick="limpiarHistorial()" class="btn-clear-history">Borrar Historial</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
